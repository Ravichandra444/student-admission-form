```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Admission Form</h1>
            <p>Please fill in the details carefully</p>
        </div>

        <form>

            <h2>Personal Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" required>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Gender</label>
                    <select required>
                        <option value="">Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nationality</label>
                    <input type="text" placeholder="Enter nationality">
                </div>

            </div>

            <h2>Contact Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter mobile number" required>
                </div>

            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea rows="4" placeholder="Enter your complete address"></textarea>
            </div>

            <h2>Academic Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Course</label>
                    <select required>
                        <option value="">Select Course</option>
                        <option>B.Tech CSE</option>
                        <option>B.Tech AI & ML</option>
                        <option>B.Tech ECE</option>
                        <option>B.Tech EEE</option>
                        <option>B.Tech IT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Previous Qualification</label>
                    <select>
                        <option value="">Select Qualification</option>
                        <option>10th</option>
                        <option>Intermediate</option>
                        <option>Diploma</option>
                    </select>
                </div>

            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Previous Institution</label>
                    <input type="text" placeholder="School / College name">
                </div>

                <div class="form-group">
                    <label>Percentage / CGPA</label>
                    <input type="number" step="0.01" placeholder="Enter percentage or CGPA">
                </div>

            </div>

            <h2>Parent / Guardian Information</h2>

            <div class="form-row">

                <div class="form-group">
                    <label>Parent / Guardian Name</label>
                    <input type="text" placeholder="Enter name">
                </div>

                <div class="form-group">
                    <label>Parent Contact Number</label>
                    <input type="tel" placeholder="Enter contact number">
                </div>

            </div>

            <div class="form-group">
                <label>Upload Student Photo</label>
                <input type="file" accept="image/*">
            </div>

            <div class="declaration">
                <input type="checkbox" required>
                <label>
                    I declare that the information provided above is true and correct.
                </label>
            </div>

            <div class="buttons">
                <button type="submit">Submit Application</button>
                <button type="reset">Reset Form</button>
            </div>

        </form>

        <footer>
            <p>© 2026 Student Admission Portal</p>
        </footer>

    </div>

</body>

</html>
```
